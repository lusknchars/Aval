# Quais dependencias podem executar script de instalacao (postinstall).
# pnpm nega por padrao e exige decisao explicita -- postinstall e o vetor
# classico de ataque de supply chain.  Cada linha abaixo e uma decisao.
allowBuilds:
  # NECESSARIO. O install.js do esbuild posiciona o binario nativo da
  # plataforma. Sem ele, tsx e vitest nao rodam.
  esbuild: true

  # Addon nativo opcional para converter bigint <-> Buffer mais rapido.
  # Ha fallback em JS puro, correto e suficiente. Recusado: exige toolchain
  # de compilacao e nao paga o risco.
  # Efeito colateral: um aviso "bigint: Failed to load bindings" no stderr.
  bigint-buffer: false

  # Otimizacoes nativas opcionais do WebSocket (dependencia do rpc-websockets,
  # que vem junto com @solana/web3.js). Ha fallback em JS puro.
  bufferutil: false
  utf-8-validate: false
